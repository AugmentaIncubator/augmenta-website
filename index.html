<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Augmenta</title>
<meta name="description" content="Augmenta. Coming soon.">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050507'/%3E%3Cpath d='M32 14 L48 50 H40 L32 31 L24 50 H16 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #050507;
    --fg: #f4f4f6;
    --muted: rgba(244, 244, 246, 0.45);
    --accent: 140, 160, 255;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* soft light that follows the cursor */
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(520px circle at var(--x, 50%) var(--y, 50%),
      rgba(var(--accent), 0.10), transparent 60%);
    transition: opacity .6s ease;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
  }

  main {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px; text-align: center; pointer-events: none;
  }
  h1 {
    font-weight: 200;
    font-size: clamp(2.6rem, 11vw, 8rem);
    letter-spacing: 0.22em;
    padding-left: 0.22em; /* optically re-centre tracked text */
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,.55) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(14px); filter: blur(10px);
    animation: rise 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  p {
    margin-top: clamp(1.2rem, 3vw, 2rem);
    font-weight: 300;
    font-size: clamp(.7rem, 1.6vw, .95rem);
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fade 1.6s ease 1.3s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    h1, p { animation-duration: .01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <h1>Augmenta</h1>
    <p>Coming soon</p>
  </main>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const glow = document.getElementById('glow');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr, pts = [];
  const mouse = { x: -9999, y: -9999, active: false };
  const LINK = 130, REPEL = 160;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(140, Math.floor((w * h) / 11000));
    pts = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      r: Math.random() * 1.2 + .4
    }));
  }

  function move(x, y) {
    mouse.x = x; mouse.y = y; mouse.active = true;
    glow.style.setProperty('--x', x + 'px');
    glow.style.setProperty('--y', y + 'px');
  }
  addEventListener('pointermove', e => move(e.clientX, e.clientY));
  addEventListener('pointerdown', e => move(e.clientX, e.clientY));
  addEventListener('pointerleave', () => { mouse.active = false; mouse.x = mouse.y = -9999; });
  addEventListener('resize', resize);

  function frame() {
    ctx.clearRect(0, 0, w, h);

    for (const p of pts) {
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < REPEL * REPEL && d2 > 1) {
          const d = Math.sqrt(d2), f = (1 - d / REPEL) * .6;
          p.vx += (dx / d) * f * .15;
          p.vy += (dy / d) * f * .15;
        }
      }
      p.vx *= .985; p.vy *= .985;
      // keep a gentle baseline drift
      if (Math.abs(p.vx) < .05) p.vx += (Math.random() - .5) * .02;
      if (Math.abs(p.vy) < .05) p.vy += (Math.random() - .5) * .02;
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
    }

    // links between neighbours
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK) {
          const alpha = (1 - Math.sqrt(d2) / LINK) * .16;
          ctx.strokeStyle = `rgba(160,175,255,${alpha})`;
          ctx.lineWidth = .6;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      // links to cursor
      if (mouse.active) {
        const a = pts[i], dx = a.x - mouse.x, dy = a.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < 220 * 220) {
          const alpha = (1 - Math.sqrt(d2) / 220) * .35;
          ctx.strokeStyle = `rgba(190,200,255,${alpha})`;
          ctx.lineWidth = .7;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }
    }

    ctx.fillStyle = 'rgba(235,240,255,.75)';
    for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); }

    if (!reduce) requestAnimationFrame(frame);
  }

  resize();
  if (reduce) frame(); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
